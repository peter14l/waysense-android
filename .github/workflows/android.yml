name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Reconstruct signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > waysense-release.jks
          echo "Keystore reconstructed successfully"

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Build Debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: WaySense-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Release APKs with signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_FILE: waysense-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: WaySense-release
          path: app/build/outputs/apk/release/*.apk

      - name: Clean up keystore
        if: always()
        run: |
          rm -f waysense-release.jks
          rm -f keystore.base64

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "WaySense ${{ github.ref_name }}"
          body: |
            ## WaySense ${{ github.ref_name }}

            ### What's New
            - See commit history for changes

            ### Known Limitations
            - All data is mock/demo data
            - No real-time transit information
            - Emergency features are simulated

            ### Installation
            Download the APK for your device architecture:
            - `WaySense-arm64-v8a.apk` — Most modern devices
            - `WaySense-armeabi-v7a.apk` — Older 32-bit devices
            - `WaySense-x86_64.apk` — Emulators

            Enable "Install from unknown sources" if prompted.

            ### Demo Disclaimer
            This is an academic prototype and does not provide real-time transportation information.
          files: |
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
